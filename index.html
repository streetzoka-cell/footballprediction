<!DOCTYPE html>
<html lang="en-KE">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  
  <!-- ★ ULTIMATE CSP: Whitelists all Firebase & Google Analytics endpoints -->
  <meta http-equiv="Content-Security-Policy" content="
  default-src 'self';

  script-src 'self'
    'unsafe-inline'
    'unsafe-eval'
    https://www.googletagmanager.com
    https://www.google-analytics.com
    https://*.google-analytics.com
    https://www.gstatic.com
    https://apis.google.com
    https://*.firebaseio.com;

  connect-src 'self'
    https://*.googleapis.com
    wss://*.firebaseio.com
    https://*.firebaseio.com
    https://*.google-analytics.com
    https://*.analytics.google.com
    https://www.google-analytics.com
    https://analytics.google.com
    https://www.google.com
    https://api.zokascore.xyz;

  img-src 'self'
    data:
    https:
    blob:;

  style-src 'self'
    'unsafe-inline'
    https://fonts.googleapis.com;

  font-src 'self'
    https://fonts.gstatic.com;

  frame-src 'self'
    https://*.firebaseapp.com
    https://*.firebaseio.com
    https://auth.zokascore.xyz;
">
  <meta name="color-scheme" content="dark light" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <meta name="theme-color" content="#05070a" />
  <meta name="application-name" content="ZOKASCORE" />
  <meta name="robots" content="index,follow,max-snippet:-1,max-image-preview:large,max-video-preview:-1" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="ZOKASCORE" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
  <link rel="search" type="application/opensearchdescription+xml" href="/opensearch.xml" title="ZOKASCORE" />
  <link rel="sitemap" type="application/xml" href="/zokascore-sitemap.xml" />

  <link rel="dns-prefetch" href="//fonts.googleapis.com" />
  <link rel="dns-prefetch" href="//fonts.gstatic.com" />
  <link rel="dns-prefetch" href="//api.zokascore.xyz" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://api.zokascore.xyz" crossorigin />

  <link rel="preload" href="/loader.css" as="style" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/loader.css" />

  <!-- ★ STATIC GLOBAL SCHEMAS (Zero Duplicates) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "url": "https://zokascore.xyz",
    "name": "ZOKASCORE",
    "description": "Get football predictions, match analysis, fixtures, live scores, and football statistics from leagues around the world.",
    "potentialAction": {
      "@type": "SearchAction",
      "target": "https://zokascore.xyz/search?q={search_term_string}",
      "query-input": "required name=search_term_string"
    }
  }
  </script>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "ZOKASCORE",
    "url": "https://zokascore.xyz",
    "logo": "https://zokascore.xyz/og-image.png",
    "sameAs": ["https://twitter.com/zokascore", "https://facebook.com/zokascore"]
  }
  </script>

  <!-- GOOGLE ANALYTICS START -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-GZ2JTNKCCN"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-GZ2JTNKCCN');
  </script>
  <!-- GOOGLE ANALYTICS END -->

</head>
<body>
  <noscript>
    <div style="padding:40px;text-align:center;font-family:Inter,system-ui,sans-serif;color:#fff;background:#05070a;min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:16px;">
      <img src="/icons/icon-192.png" alt="ZOKASCORE" width="80" height="80" style="border-radius:16px;" />
      <h1 style="font-size:1.5rem;font-weight:800;margin:0;">ZOKASCORE</h1>
      <p style="color:#94a3b8;max-width:400px;line-height:1.6;">ZOKASCORE requires JavaScript. Please enable it in your browser settings.</p>
    </div>
  </noscript>

  <div id="static-loader" role="status" aria-live="polite">
    <div class="loader-ball">⚽</div>
    <div class="loader-text">ZOKASCORE</div>
    <div class="loader-bar"><div class="loader-bar-fill"></div></div>
    <div id="loader-status-text" class="loader-status-text">Initializing...</div>
  </div>

  <div id="root"></div>

  <script>
    (function() {
      var t = document.getElementById('loader-status-text');
      var l = document.getElementById('static-loader');
      if (!navigator.onLine) { if(t) t.textContent='You are offline. Reconnect to load ZOKASCORE.'; return; }
      var msgs=['Loading Live Matches...','Synchronizing Fixtures...','Preparing Predictions...','Fetching Leaderboards...'];
      var i=0; var iv=setInterval(function(){if(i<msgs.length){if(t)t.textContent=msgs[i];i++;}else clearInterval(iv);},1500);
      setTimeout(function(){if(!document.getElementById('root').children.length&&l&&t){t.innerHTML='Taking longer than usual. <a href="/" style="color:#16c784;text-decoration:underline;font-weight:700;">Retry</a>';}},10000);
    })();
  </script>

  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
