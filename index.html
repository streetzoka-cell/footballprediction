  <title>ZOKASCORE - Live Football Scores, AI Predictions & News</title>
  <meta name="description" content="Get live football scores, fixtures, AI-powered match predictions, and breaking news from leagues worldwide on ZOKASCORE." />

  <meta name="mobile-web-app-capable" content="yes" />

  <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />

  <link rel="search" type="application/opensearchdescription+xml" href="/opensearch.xml" title="ZOKASCORE" />
  <link rel="sitemap" type="application/xml" href="/zokascore-sitemap.xml" />

  <!-- ★ CORE WEB VITALS: Preload Critical Font & API DNS -->
  <link rel="preload" href="https://fonts.gstatic.com/s/inter/v18/UcCO3FwrK3iLTeHuS_nVMrMxCp50SjIw2boKoduKmMEVuLyfAZ9hiA.woff2" as="font" type="font/woff2" crossorigin />
  
  <link rel="dns-prefetch" href="//fonts.googleapis.com" />
  <link rel="dns-prefetch" href="//fonts.gstatic.com" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://api.zokascore.xyz" crossorigin />

  <link rel="preload" href="/loader.css" as="style" />
  <link rel="stylesheet" href="/loader.css" />

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- ★ VALIDATION FIX: Default JSON-LD to satisfy validate-deployment.js -->
  <!-- React Helmet will inject page-specific schemas, but this prevents the build warning -->
  <script type="application/ld+json" id="default-schema">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "ZOKASCORE",
      "url": "https://zokascore.xyz",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://zokascore.xyz/search?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
  </script>

  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-GZ2JTNKCCN"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-GZ2JTNKCCN');
  </script>

  <!-- Google AdSense -->
  <script async
    src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4820100355705138"
    crossorigin="anonymous"></script>
</head>

<body>
  <noscript>
    <div style="padding:40px;text-align:center;font-family:Inter,system-ui,sans-serif;color:#fff;background:#05070a;min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:16px;">
      <img src="/icons/icon-192.png" alt="ZOKASCORE" width="80" height="80" style="border-radius:16px;" />
      <h1 style="font-size:1.5rem;font-weight:800;margin:0;">ZOKASCORE</h1>
      <p style="color:#94a3b8;max-width:400px;line-height:1.6;">ZOKASCORE requires JavaScript. Please enable it in your browser settings.</p>
    </div>
  </noscript>

  <div id="static-loader" role="status" aria-live="polite">
    <div class="loader-ball">⚽</div>
    <div class="loader-text">ZOKASCORE</div>
    <div class="loader-bar"><div class="loader-bar-fill"></div></div>
    <div id="loader-status-text" class="loader-status-text">Initializing...</div>
  </div>

  <!-- ★ VALIDATION FIX: Exact empty root div to satisfy validate-deployment.js -->
  <div id="root"></div>

  <!-- ★ PHASE 9: SEO Fallback for non-JS crawlers (Safe inside noscript) -->
  <noscript>
    <div style="padding: 20px; font-family: system-ui, sans-serif; max-width: 800px; margin: 0 auto; color: #ffffff; background: #05070a;">
      <h1 style="font-size: 24px; margin-bottom: 10px;">Live Football Scores, Fixtures, Results & Predictions</h1>
      <p style="color: #94a3b8; margin-bottom: 20px;">Welcome to ZOKASCORE. Track today's football fixtures, make AI-powered predictions, and follow live scores from leagues worldwide.</p>
      <nav aria-label="Primary Navigation" style="display: flex; gap: 15px; flex-wrap: wrap;">
        <a href="/fixtures" style="color: #16c784; font-weight: bold;">Today's Fixtures</a>
        <a href="/predictions" style="color: #16c784; font-weight: bold;">Match Predictions</a>
        <a href="/league/39/premier-league" style="color: #16c784;">Premier League</a>
        <a href="/league/140/la-liga" style="color: #16c784;">La Liga</a>
        <a href="/league/2/champions-league" style="color: #16c784;">Champions League</a>
        <a href="/team/33/manchester-united" style="color: #16c784;">Manchester United</a>
        <a href="/team/541/real-madrid" style="color: #16c784;">Real Madrid</a>
      </nav>
    </div>
  </noscript>

  <script>
    (function() {
      var t = document.getElementById('loader-status-text');
      var l = document.getElementById('static-loader');
      if (!navigator.onLine) { if(t) t.textContent='You are offline. Reconnect to load ZOKASCORE.'; return; }
      var msgs=['Loading Live Matches...','Synchronizing Fixtures...','Preparing Predictions...','Fetching Leaderboards...'];
      var i=0; var iv=setInterval(function(){if(i<msgs.length){if(t)t.textContent=msgs[i];i++;}else clearInterval(iv);},1500);
      setTimeout(function(){if(!document.getElementById('root').children.length&&l&&t){t.innerHTML='Taking longer than usual. <a href="/" style="color:#16c784;text-decoration:underline;font-weight:700;">Retry</a>';}},10000);
    })();
  </script>

  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
